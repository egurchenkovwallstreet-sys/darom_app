<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Даром — бесплатная передача вещей">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Даром">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png?v=5">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=5">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=5">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=5">

  <link rel="icon" type="image/png" href="favicon.png?v=5"/>
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <title>Даром</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFF9F4;
    }

    #darom-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease;
    }

    #darom-splash.is-hiding {
      opacity: 0;
      pointer-events: none;
    }

    #darom-splash .splash-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #FFF9F4, #FFECD9, #F5DFC8);
      z-index: 0;
    }

    #darom-splash .splash-status {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      color: rgba(80, 55, 40, 0.88);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 16px;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 0 24px;
    }

    #darom-splash .splash-spinner {
      position: relative;
      z-index: 2;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(0, 140, 140, 0.2);
      border-top-color: #00BFFF;
      animation: splash-spin 0.9s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="darom-splash" aria-live="polite">
    <div class="splash-gradient"></div>
    <div class="splash-spinner" role="progressbar" aria-label="Загрузка"></div>
    <p class="splash-status" id="darom-splash-text">Загрузка приложения…</p>
  </div>
  <script>
    (function () {
      var DAROM_WEB_BUILD = '2026-11-14-4';
      var buildKey = 'darom_web_build';
      var sessionReadyKey = 'darom_web_ready_' + DAROM_WEB_BUILD;

      function lsGet(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }
      function lsSet(key, value) {
        try { localStorage.setItem(key, value); } catch (e) {}
      }
      function ssGet(key) {
        try { return sessionStorage.getItem(key); } catch (e) { return null; }
      }
      function ssSet(key, value) {
        try { sessionStorage.setItem(key, value); } catch (e) {}
      }

      if (ssGet(sessionReadyKey) === '1') {
        return;
      }

      var previousBuild = lsGet(buildKey);
      var shouldMigrateCache = previousBuild !== null && previousBuild !== DAROM_WEB_BUILD;

      if (shouldMigrateCache && ssGet('darom_resetting') !== '1') {
        ssSet('darom_resetting', '1');
        var chain = Promise.resolve();
        if ('serviceWorker' in navigator) {
          chain = navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          });
        }
        chain = chain.then(function () {
          if (!window.caches) return;
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          });
        });
        chain.then(function () {
          lsSet(buildKey, DAROM_WEB_BUILD);
          location.reload();
        });
        return;
      }

      lsSet(buildKey, DAROM_WEB_BUILD);
      ssSet('darom_resetting', '0');
      ssSet(sessionReadyKey, '1');
    })();
  </script>
  <script>
    (function () {
      var splash = document.getElementById('darom-splash');
      var splashText = document.getElementById('darom-splash-text');
      if (!splash) return;

      var fadeMs = 350;
      var hidden = false;

      window.daromHideSplash = function daromHideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('is-hiding');
        setTimeout(function () {
          splash.style.display = 'none';
        }, fadeMs);
      };

      var loadStarted = Date.now();
      var statusTimer = setInterval(function () {
        var sec = Math.round((Date.now() - loadStarted) / 1000);
        if (sec >= 8 && splashText) {
          splashText.textContent = 'Загрузка занимает больше обычного… Подождите ещё немного';
        } else if (sec >= 3 && splashText) {
          splashText.textContent = 'Загрузка приложения…';
        }
      }, 1000);

      window.addEventListener('error', function () {
        if (!splashText || hidden) return;
        splashText.textContent = 'Загрузка приложения…';
      });

      window.addEventListener('pagehide', function () {
        clearInterval(statusTimer);
      });

      function flutterMounted() {
        return document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      }

      function tryHideAfterFlutter() {
        if (!flutterMounted()) return false;
        setTimeout(function () {
          window.daromHideSplash();
        }, 1200);
        return true;
      }

      if (!tryHideAfterFlutter()) {
        var observer = new MutationObserver(function () {
          if (tryHideAfterFlutter()) observer.disconnect();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20261114-4" defer></script>
</body>
</html>
