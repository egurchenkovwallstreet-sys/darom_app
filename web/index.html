<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Даром — бесплатная передача вещей">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Даром">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png?v=4">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=4">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=4">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=4">

  <link rel="icon" type="image/png" href="favicon.png?v=4"/>
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <title>Даром</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #001F3F;
    }

    #darom-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease;
    }

    #darom-splash.is-hiding {
      opacity: 0;
      pointer-events: none;
    }

    #darom-splash .splash-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom right, #001F3F, #008C8C, #00BFFF);
      z-index: 0;
    }

    #darom-splash .splash-status {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      color: rgba(255, 255, 255, 0.92);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 16px;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 0 24px;
    }

    #darom-splash .splash-spinner {
      position: relative;
      z-index: 2;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #00BFFF;
      animation: splash-spin 0.9s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="darom-splash" aria-live="polite">
    <div class="splash-gradient"></div>
    <div class="splash-spinner" role="progressbar" aria-label="Загрузка"></div>
    <p class="splash-status" id="darom-splash-text">Загрузка приложения…</p>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('darom-splash');
      var splashText = document.getElementById('darom-splash-text');
      if (!splash) return;

      var fadeMs = 350;
      var hidden = false;

      window.daromHideSplash = function daromHideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('is-hiding');
        setTimeout(function () {
          splash.style.display = 'none';
        }, fadeMs);
      };

      var loadStarted = Date.now();
      var statusTimer = setInterval(function () {
        var sec = Math.round((Date.now() - loadStarted) / 1000);
        if (sec >= 8 && splashText) {
          splashText.textContent = 'Загрузка занимает больше обычного… Подождите ещё немного';
        } else if (sec >= 3 && splashText) {
          splashText.textContent = 'Подготовка интерфейса…';
        }
      }, 1000);

      window.addEventListener('error', function (event) {
        if (!splashText || hidden) return;
        splashText.textContent = 'Ошибка загрузки. Обновите страницу или проверьте интернет';
      });

      window.addEventListener('pagehide', function () {
        clearInterval(statusTimer);
      });
    })();
  </script>
  <script src="push_helper.js?v=4" defer></script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
