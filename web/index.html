<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="Даром — бесплатная передача вещей">
  <meta name="theme-color" content="#F9F6F0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Даром">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-192.png?v=5">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=5">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=5">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=5">

  <link rel="icon" type="image/png" href="favicon.png?v=5"/>
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <title>Даром</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F9F6F0;
    }

    #darom-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.35s ease;
    }

    #darom-splash.is-hiding {
      opacity: 0;
      pointer-events: none;
    }

    #darom-splash .splash-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, #F9F6F0, #F3EDE4);
      z-index: 0;
    }

    #darom-splash .splash-status {
      position: relative;
      z-index: 2;
      margin-top: 24px;
      color: rgba(80, 55, 40, 0.88);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      font-size: 16px;
      letter-spacing: 0.02em;
      text-align: center;
      padding: 0 24px;
    }

    #darom-splash .splash-spinner {
      position: relative;
      z-index: 2;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3px solid rgba(255, 90, 54, 0.15);
      border-top-color: #FF5A36;
      animation: splash-spin 0.9s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var BUILD_ID = '20261116-warm-ui';
      var STORAGE_KEY = 'darom_web_build';
      try {
        if (localStorage.getItem(STORAGE_KEY) !== BUILD_ID) {
          localStorage.setItem(STORAGE_KEY, BUILD_ID);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            }).catch(function () {});
          }
        }
      } catch (e) { /* private mode */ }
    })();
  </script>
  <div id="darom-splash" aria-live="polite">
    <div class="splash-gradient"></div>
    <div class="splash-spinner" role="progressbar" aria-label="Загрузка"></div>
    <p class="splash-status" id="darom-splash-text">Загрузка приложения…</p>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('darom-splash');
      var splashText = document.getElementById('darom-splash-text');
      if (!splash) return;

      var fadeMs = 350;
      var hidden = false;

      window.daromHideSplash = function daromHideSplash() {
        if (hidden) return;
        hidden = true;
        splash.classList.add('is-hiding');
        setTimeout(function () {
          splash.style.display = 'none';
        }, fadeMs);
      };

      var loadStarted = Date.now();
      var statusTimer = setInterval(function () {
        var sec = Math.round((Date.now() - loadStarted) / 1000);
        if (sec >= 8 && splashText) {
          splashText.textContent = 'Загрузка занимает больше обычного… Подождите ещё немного';
        } else if (sec >= 3 && splashText) {
          splashText.textContent = 'Загрузка приложения…';
        }
      }, 1000);

      function showLoadError(msg) {
        if (!splashText || hidden) return;
        splashText.textContent = msg;
        splashText.style.color = '#1E293B';
        splashText.style.maxWidth = '320px';
        splashText.style.lineHeight = '1.5';
      }

      window.addEventListener('error', function () {
        var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
        showLoadError(isIos
          ? 'Ошибка загрузки в Safari. Закройте вкладку, откройте сайт снова. Если не помогло — Настройки Safari → Дополнения → выключите блокировщики для этого сайта.'
          : 'Ошибка загрузки. Нажмите Ctrl+Shift+R или откройте сайт в режиме инкогнито.');
      });

      window.addEventListener('pagehide', function () {
        clearInterval(statusTimer);
      });

      function flutterMounted() {
        return document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      }

      function tryHideAfterFlutter() {
        if (!flutterMounted()) return false;
        setTimeout(function () {
          window.daromHideSplash();
        }, 1200);
        return true;
      }

      if (!tryHideAfterFlutter()) {
        var observer = new MutationObserver(function () {
          if (tryHideAfterFlutter()) observer.disconnect();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      }

      window.addEventListener('flutter-first-frame', function () {
        window.daromHideSplash();
      });

      var pollTicks = 0;
      var pollTimer = setInterval(function () {
        pollTicks += 1;
        if (flutterMounted()) {
          clearInterval(pollTimer);
          window.daromHideSplash();
        } else if (pollTicks >= 120) {
          clearInterval(pollTimer);
          if (!flutterMounted()) {
            var isIos = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
            showLoadError(isIos
              ? 'Приложение не загрузилось. В Safari: закройте вкладку и откройте darom-app.online снова. Проверьте, что включён JavaScript.'
              : 'Приложение не загрузилось. Обновите страницу: Ctrl+Shift+R (жёсткое обновление).');
          }
        }
      }, 250);
    })();
  </script>
  <script src="flutter_bootstrap.js?v=20261116-warm-ui" defer></script>
</body>
</html>
