# Gzip для Flutter Web — main.dart.js (~3.5 МБ) и canvaskit.wasm (~7 МБ)
# Подключение: файл копируется в /etc/nginx/conf.d/ (см. deploy/NGINX_GZIP.md)

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  application/wasm
  image/svg+xml
  font/ttf
  font/woff
  font/woff2;
